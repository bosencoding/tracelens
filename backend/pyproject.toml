[project]
name = "tracelens-api"
version = "0.1.0"
description = "TraceLens — JPEG signature identification API (EXIF + quantization tables + encoder fingerprint; synthetic data)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.9",
    "pillow>=11.0",
    "playwright>=1.64.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.7"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"]
